services:

  # ============================================================
  # Tailscale sidecar
  # Joins your tailnet and provides a 100.x.x.x IP that friends
  # use to reach the game server.
  # ============================================================
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY}"
      TS_STATE_DIR: "/var/lib/tailscale"
      # Advertise a hostname in your tailnet
      TS_EXTRA_ARGS: "--hostname=sandstorm-server"
      TS_USERSPACE: "false"

  # ============================================================
  # Insurgency: Sandstorm Dedicated Server
  # Shares the Tailscale container's network stack entirely.
  # Reachable at the tailscale container's 100.x.x.x IP on port 27102.
  # ============================================================
  sandstorm:
    image: andrewmhub/insurgency-sandstorm:lite
    container_name: insurgency-sandstorm
    restart: unless-stopped
    depends_on:
      - tailscale
    # Share Tailscale's network namespace — the game server is
    # directly reachable at the Tailscale IP, no port mapping needed.
    network_mode: "service:tailscale"

    volumes:
      - ./data:/home/steam/steamcmd/sandstorm:rw

    environment:
      HOSTNAME: "${SERVER_NAME:-My Sandstorm Server}"
      PORT: "27102"
      QUERYPORT: "27131"
      LAUNCH_SERVER_ENV: >-
        ${MAP:-Farmhouse}?Scenario=${SCENARIO:-Scenario_Farmhouse_Checkpoint_Security}?MaxPlayers=${MAX_PLAYERS:-10}?password=${SERVER_PASSWORD}
        -GSLTToken=${GSLT_TOKEN}
        -NoSteamServer
        -log
        -logbufferless
