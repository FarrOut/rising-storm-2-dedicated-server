name: InstallSteamCMD
description: Installs SteamCMD on Ubuntu
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: InstallDependencies
        action: ExecuteBash
        inputs:
          commands:
            - sudo apt-get update
            - sudo apt-get install -y lib32gcc-s1 lib32stdc++6

      - name: CreateSteamCMDDirectory
        action: ExecuteBash
        inputs:
          commands:
            - mkdir -p ~/steamcmd

      - name: DownloadSteamCMD
        action: ExecuteBash
        inputs:
          commands:
            - cd ~/steamcmd
            - curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -

      - name: SetPermissions
        action: ExecuteBash
        inputs:
          commands:
            - chmod +x ~/steamcmd/steamcmd.sh
            - chmod -R 755 ~/steamcmd
            - chmod 755 ~

      - name: UpdateSteamCMD
        action: ExecuteBash
        inputs:
          commands:
            - ~/steamcmd/steamcmd.sh +quit

      - name: CreateSymlink
        action: ExecuteBash
        inputs:
          commands:
            - sudo ln -s /root/steamcmd/steamcmd.sh /usr/local/bin/steamcmd
            - sudo chmod 755 /usr/local/bin/steamcmd
            - sudo chmod 755 /root/steamcmd/steamcmd.sh
